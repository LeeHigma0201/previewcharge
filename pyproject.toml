[project]
name = "horsegpt"
version = "3.14.0"
description = "Multi-model horse racing handicapping tool"
requires-python = ">=3.10"
dependencies = [
    # Core
    "sqlalchemy>=2.0,<3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "streamlit>=1.30",
    "pyyaml>=6.0",
    # Phase 2+
    "lightgbm>=4.0",
    "shap>=0.44",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
    "torch-geometric>=2.4",
    "catboost>=1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.7",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "dashboard*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
